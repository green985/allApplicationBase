# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# =============================================================================
# Gradle Daemon & Parallelism
# =============================================================================
org.gradle.daemon=true
org.gradle.parallel=true
# 8 logical cores on this machine; leave 2 for the OS
org.gradle.workers.max=6
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.configuration-cache=true
# =============================================================================
# JVM Memory (Gradle daemon)
# 16 GB RAM available ? raised heap to 6 g; G1GC for large heaps on Java 18;
# SoftRefLRUPolicyMSPerMB=0 prevents soft-reference pressure during big builds;
# ReservedCodeCacheSize avoids JIT eviction on long incremental builds.
# =============================================================================
org.gradle.jvmargs=-Xmx6g \
  -XX:+HeapDumpOnOutOfMemoryError \
  -Dfile.encoding=UTF-8 \
  -XX:+UseG1GC \
  -XX:SoftRefLRUPolicyMSPerMB=0 \
  -XX:ReservedCodeCacheSize=512m
# =============================================================================
# Kotlin Compiler Daemon
# Runs in a separate process; give it dedicated heap so it does not compete
# with the Gradle daemon.
# =============================================================================
kotlin.daemon.jvm.options=-Xmx4g -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=0
# =============================================================================
# Kotlin Incremental Compilation
# =============================================================================
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.usePreciseJavaTracking=true
# =============================================================================
# Android
# =============================================================================
android.useAndroidX=true
# Keep Jetifier enabled: exoplayer:2.18 still references support-library internals
android.enableJetifier=true
android.enableR8.fullMode=true
# Non-transitive R class reduces R.class size significantly in multi-module builds
android.nonTransitiveRClass=true
android.debug.obsoleteApi=true
android.enableBuildScriptClasspathCheck=false
android.suppressUnsupportedCompileSdk=36
android.disallowKotlinSourceSets=false