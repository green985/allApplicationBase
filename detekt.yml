build:
  maxIssues: 0

style:
  MaxLineLength:
    maxLineLength: 120
    excludeCommentStatements: true

naming:
  FunctionNaming:
    active: true
    excludes: [ '**/src/main/**/compose/**', '**/src/main/**/ui/**', '**/composeBase/**' ]
    ignoreAnnotated: [ 'Composable', 'androidx.compose.runtime.Composable' ]
    functionPattern: '[a-z][a-zA-Z0-9]*'
