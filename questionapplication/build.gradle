            storePassword '7SPd@WF0Lx!RGb2S'
            keyPassword '7SPd@WF0Lx!RGb2S'
            keyAlias 'oyetech'
        }
    }
    buildTypes {
        debug {
            ext.alwaysUpdateBuildId = false
